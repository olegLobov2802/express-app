services:
  postgres:
    image: postgres:16-alpine
    container_name: express_app_postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: express_app
      POSTGRES_PASSWORD: express_app
      POSTGRES_DB: express_app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U express_app -d express_app']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: express_app
    profiles: [full]
    restart: unless-stopped
    ports:
      - '${PORT:-8000}:8000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://express_app:express_app@postgres:5432/express_app
      NODE_ENV: production
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
